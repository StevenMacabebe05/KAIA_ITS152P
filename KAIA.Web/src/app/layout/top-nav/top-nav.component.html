<header class="topnav">
  <div class="topnav__inner">

    <a routerLink="/dashboard" class="topnav__brand" aria-label="KAIA home">
      <img src="logo.png" alt="KAIA" class="topnav__brand-img" />
    </a>

    <nav class="topnav__links" aria-label="Primary">
      @for (item of navItems; track item.path) {
        <a
          class="topnav__link"
          [routerLink]="item.disabled ? null : item.path"
          routerLinkActive="topnav__link--active"
          [class.topnav__link--disabled]="item.disabled"
          [attr.title]="item.disabled ? (item.label + ' — coming in ' + item.badge) : item.label"
        >
          {{ item.label }}
          @if (item.badge) {
            <span class="topnav__badge-pill">{{ item.badge }}</span>
          }
        </a>
      }
    </nav>

    <div class="topnav__actions">
      <button class="topnav__icon-btn" type="button" aria-label="Search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="7"/><path d="m21 21-3.5-3.5"/>
        </svg>
      </button>

      <button class="topnav__icon-btn" type="button" aria-label="Notifications">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M18 8a6 6 0 1 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/>
          <path d="M13.7 21a2 2 0 0 1-3.4 0"/>
        </svg>
        <span class="topnav__badge">3</span>
      </button>

      <div class="topnav__user" title="Demo user">
        <span class="topnav__user-avatar">D</span>
        <span class="topnav__user-name">Demo</span>
      </div>
    </div>

  </div>
</header>
